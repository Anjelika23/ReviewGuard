<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fake Review Detection & Trust Scoring{% endblock %}</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#667085;--line:#e4e7ec;--brand:#3b5bdb;--good:#2b9348;--warn:#e8890c;--bad:#d62839}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#eef0f4;--mute:#98a2b3;--line:#2a2f38;--brand:#7c93ff;--good:#5bd17c;--warn:#ffb04a;--bad:#ff6b7a}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  nav{display:flex;gap:22px;align-items:center;height:56px}nav b{font-size:16px;margin-right:auto}
  nav a{color:var(--mute);text-decoration:none;font-weight:500}nav a:hover{color:var(--brand)}
  main{padding:24px 0 60px}h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:28px 0 10px}.sub{color:var(--mute);margin:0 0 20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card .k{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.card .v{font-size:26px;font-weight:650;margin-top:2px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
  tr:last-child td{border-bottom:0}.scroll{overflow-x:auto}
  .bar{height:8px;border-radius:6px;background:var(--line);min-width:90px;overflow:hidden}.bar i{display:block;height:100%}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
  .Excellent,.Good,.genuine{color:var(--good)}.Fair{color:var(--warn)}.Poor,.fake{color:var(--bad)}
  a{color:var(--brand)}label{display:block;font-weight:600;margin:12px 0 4px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
  button{margin-top:16px;padding:10px 18px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tabs a{margin-right:14px;text-decoration:none;font-weight:600;color:var(--mute)}.tabs a.on{color:var(--brand)}
  .reason{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--line);padding:1px 8px;border-radius:6px;margin:2px 4px 0 0;color:var(--mute)}
  .mono{font-variant-numeric:tabular-nums}
  main{padding-top:32px}.card{box-shadow:0 8px 24px rgba(16,24,40,.045)}
  button{transition:transform .15s ease,filter .15s ease}button:hover{filter:brightness(1.08);transform:translateY(-1px)}
  input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--brand) 22%,transparent);border-color:var(--brand)}
  .error,.errorlist{color:var(--bad);font-size:13px;margin:6px 0;padding-left:18px}
  .result-card{min-height:220px}.sub{line-height:1.6}
  @media(max-width:650px){.wrap{padding:0 14px}nav{gap:12px;flex-wrap:wrap;height:auto;min-height:56px;padding:12px 0}nav b{width:100%}.row{grid-template-columns:1fr}.card .v{font-size:23px}th,td{padding:9px}}
</style>
</head>
<body>
<header><div class="wrap"><nav><b>🎬 ReviewGuard <span style="color:var(--mute);font-weight:400;font-size:12px">AI TRUST ANALYTICS</span></b>
  <a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'analyze' %}">Analyze a review</a><a href="/admin/">Admin</a></nav></div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
</body></html>
