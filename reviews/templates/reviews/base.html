<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ReviewGuard — AI Trust Analytics & Fake Review Detection{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    
    /* Light theme variables */
    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --bg-card-subtle: #f1f5f9;
    --bg-input: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --border-hover: #cbd5e1;
    --brand: #4f46e5;
    --brand-light: #eef2ff;
    --brand-hover: #4338ca;
    
    --good: #10b981;
    --good-bg: #ecfdf5;
    --good-border: #a7f3d0;
    
    --warn: #f59e0b;
    --warn-bg: #fffbeb;
    --warn-border: #fde68a;
    
    --bad: #ef4444;
    --bad-bg: #fef2f2;
    --bad-border: #fecaca;
    
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
  }

  [data-theme="dark"] {
    --bg-page: #090d16;
    --bg-card: #111827;
    --bg-card-subtle: #1f2937;
    --bg-input: #0b0f19;
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --border: #232d3f;
    --border-hover: #374151;
    --brand: #6366f1;
    --brand-light: rgba(99, 102, 241, 0.15);
    --brand-hover: #4f46e5;
    
    --good: #34d399;
    --good-bg: rgba(16, 185, 129, 0.12);
    --good-border: rgba(16, 185, 129, 0.25);
    
    --warn: #fbbf24;
    --warn-bg: rgba(245, 158, 11, 0.12);
    --warn-border: rgba(245, 158, 11, 0.25);
    
    --bad: #f87171;
    --bad-bg: rgba(239, 68, 68, 0.12);
    --bad-border: rgba(239, 68, 68, 0.25);
    
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 10px 20px -3px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--bg-page);
    color: var(--text-primary);
    line-height: 1.5;
    font-size: 14.5px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header & Navigation */
  header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(12px);
  }
  .wrap {
    max-width: 1220px;
    margin: 0 auto;
    padding: 0 24px;
    width: 100%;
  }
  nav {
    display: flex;
    align-items: center;
    height: 64px;
    gap: 24px;
  }
  .brand-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-primary);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.02em;
    margin-right: auto;
  }
  .brand-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #4f46e5, #06b6d4);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
  }
  .nav-tag {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    background: var(--brand-light);
    color: var(--brand);
    padding: 2px 7px;
    border-radius: 6px;
    letter-spacing: 0.05em;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .nav-links a {
    color: var(--text-secondary);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 6px;
    transition: all 0.15s ease;
  }
  .nav-links a:hover, .nav-links a.active {
    color: var(--brand);
    background: var(--brand-light);
  }
  .theme-btn {
    background: var(--bg-card-subtle);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  .theme-btn:hover {
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }

  /* Main container */
  main {
    flex: 1;
    padding: 32px 0 64px;
  }
  h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin: 0 0 6px;
  }
  h2 {
    font-size: 18px;
    font-weight: 700;
    margin: 36px 0 14px;
    letter-spacing: -0.015em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sub {
    color: var(--text-muted);
    margin: 0 0 24px;
    font-size: 14.5px;
    line-height: 1.6;
  }

  /* Cards & Layout */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    border-color: var(--border-hover);
  }
  .card .k {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card .v {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-top: 6px;
    color: var(--text-primary);
  }
  .card .hint {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Pills & Badges */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid currentColor;
    white-space: nowrap;
  }
  .pill.Excellent { color: var(--good); background: var(--good-bg); border-color: var(--good-border); }
  .pill.Good { color: #3b82f6; background: rgba(59, 130, 246, 0.12); border-color: rgba(59, 130, 246, 0.25); }
  .pill.Fair { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-border); }
  .pill.Poor { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-border); }
  .pill.fake { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-border); }
  .pill.genuine { color: var(--good); background: var(--good-bg); border-color: var(--good-border); }

  .Excellent, .Good, .genuine { color: var(--good); }
  .Fair { color: var(--warn); }
  .Poor, .fake { color: var(--bad); }

  /* Tables */
  .table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .scroll { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  th {
    background: var(--bg-card-subtle);
    color: var(--text-muted);
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    color: var(--text-primary);
  }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: rgba(99, 102, 241, 0.03); }

  /* Meters & Progress Bars */
  .bar {
    height: 7px;
    border-radius: 9999px;
    background: var(--border);
    min-width: 100px;
    overflow: hidden;
    margin-top: 4px;
  }
  .bar i {
    display: block;
    height: 100%;
    border-radius: 9999px;
    transition: width 0.4s ease;
  }

  /* Forms & Inputs */
  label {
    display: block;
    font-weight: 700;
    font-size: 13px;
    margin: 14px 0 5px;
    color: var(--text-primary);
  }
  input, select, textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg-input);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 14px;
    transition: all 0.15s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-light);
  }
  button, .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 20px;
    border: 0;
    border-radius: 9px;
    background: var(--brand);
    color: white;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s ease;
    box-shadow: var(--shadow-sm);
  }
  button:hover, .btn:hover {
    background: var(--brand-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-primary);
  }
  .btn-outline:hover {
    background: var(--bg-card-subtle);
    border-color: var(--border-hover);
    color: var(--text-primary);
  }

  /* Utility & Components */
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .reason {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    font-weight: 600;
    background: var(--bg-card-subtle);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 6px;
    margin: 2px 4px 2px 0;
    color: var(--text-secondary);
  }
  .reason::before { content: "•"; color: var(--bad); font-weight: bold; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs a {
    text-decoration: none;
    font-weight: 700;
    font-size: 13.5px;
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    transition: all 0.15s ease;
  }
  .tabs a:hover { color: var(--text-primary); border-color: var(--border-hover); }
  .tabs a.on {
    color: white;
    background: var(--brand);
    border-color: var(--brand);
  }

  /* Pagination */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--bg-card-subtle);
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
  }
  .pagination a {
    text-decoration: none;
    color: var(--brand);
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-card);
  }
  .pagination a:hover { background: var(--brand-light); }

  /* Footer */
  footer {
    border-top: 1px solid var(--border);
    background: var(--bg-card);
    padding: 24px 0;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: auto;
  }
  .footer-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  @media (max-width: 768px) {
    .row { grid-template-columns: 1fr; }
    nav { height: auto; padding: 14px 0; flex-wrap: wrap; gap: 12px; }
    .brand-logo { width: 100%; }
    .nav-links { width: 100%; justify-content: flex-start; overflow-x: auto; }
  }
</style>
<script>
  // Theme switcher
  (function() {
    const saved = localStorage.getItem('reviewguard_theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('reviewguard_theme', next);
    const label = document.getElementById('theme-label');
    if (label) label.textContent = next === 'dark' ? '🌙 Dark' : '☀️ Light';
  }
</script>
</head>
<body>
<header>
  <div class="wrap">
    <nav>
      <a href="{% url 'dashboard' %}" class="brand-logo">
        <div class="brand-icon">🛡️</div>
        ReviewGuard
        <span class="nav-tag">AI TRUST ENGINE</span>
      </a>
      <div class="nav-links">
        <a href="{% url 'dashboard' %}">📊 Dashboard</a>
        <a href="{% url 'analyze' %}">⚡ Analyze Review</a>
        <a href="{% url 'api_docs' %}">🔌 API Reference</a>
        <a href="/admin/">⚙️ Admin</a>
      </div>
      <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle theme">
        <span id="theme-label">🌓 Theme</span>
      </button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>

<footer>
  <div class="wrap footer-wrap">
    <div><b>ReviewGuard</b> — Dual-Feature Stacking for Fake Review Detection & Trust Scoring</div>
    <div class="mono" style="font-size:12px">Backend v2.0.0 • SQLite/Postgres Ready • Health Endpoint: <a href="/health/" target="_blank" style="color:var(--brand)">/health/</a></div>
  </div>
</footer>
</body>
</html>
